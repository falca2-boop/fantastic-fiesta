<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JARVIS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #030810;
      --bg2: #060f1e;
      --accent: #0af;
      --accent2: #07f;
      --glow: rgba(0, 170, 255, 0.35);
      --text: #c8e8ff;
      --text-dim: #4a7a9b;
      --panel: rgba(0, 30, 60, 0.7);
      --border: rgba(0, 170, 255, 0.2);
      --danger: #f05;
      --warn: #fa0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Share Tech Mono', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow: hidden;
    }

    /* ── HEADER ── */
    header {
      width: 100%;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
      backdrop-filter: blur(8px);
    }
    .logo {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.3rem;
      letter-spacing: 6px;
      color: var(--accent);
      text-shadow: 0 0 12px var(--glow);
    }
    .status-bar {
      display: flex;
      gap: 16px;
      font-size: 0.65rem;
      color: var(--text-dim);
    }
    .status-bar span { display: flex; align-items: center; gap: 4px; }
    .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--text-dim);
      transition: background .4s, box-shadow .4s;
    }
    .dot.active { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
    .dot.error  { background: var(--danger); box-shadow: 0 0 8px var(--danger); }
    .dot.warn   { background: var(--warn);   box-shadow: 0 0 8px var(--warn); }

    /* ── MAIN ── */
    main {
      flex: 1;
      width: 100%;
      max-width: 860px;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 0;
      gap: 24px;
    }

    /* ── ORB ── */
    #orb-wrap {
      position: relative;
      width: 180px; height: 180px;
      cursor: pointer;
      flex-shrink: 0;
    }
    #orb-canvas { display: block; }
    #orb-hint {
      position: absolute;
      bottom: -20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.6rem;
      color: var(--text-dim);
      white-space: nowrap;
      transition: opacity .3s;
    }

    /* ── WAVEFORM ── */
    #wave-canvas {
      width: 100%;
      max-width: 400px;
      height: 40px;
    }

    /* ── STATUS TEXT ── */
    #status {
      font-size: 0.7rem;
      color: var(--text-dim);
      letter-spacing: 2px;
      text-transform: uppercase;
      min-height: 1.2em;
      transition: color .3s;
    }
    #status.listening  { color: var(--accent); }
    #status.thinking   { color: var(--warn); }
    #status.speaking   { color: #0f9; }
    #status.error      { color: var(--danger); }

    /* ── REPLY PANEL ── */
    #reply-panel {
      width: 100%;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px 20px;
      min-height: 80px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: border-color .3s, box-shadow .3s;
    }
    #reply-panel.active {
      border-color: var(--accent);
      box-shadow: 0 0 16px var(--glow);
    }
    #reply-label {
      font-size: 0.6rem;
      color: var(--text-dim);
      letter-spacing: 3px;
      text-transform: uppercase;
    }
    #reply-text {
      font-size: 0.95rem;
      line-height: 1.6;
      color: var(--text);
      min-height: 1.5em;
    }

    /* ── TRANSCRIPT ── */
    #transcript-panel {
      width: 100%;
      max-height: 160px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    #transcript-panel::-webkit-scrollbar { width: 4px; }
    #transcript-panel::-webkit-scrollbar-track { background: transparent; }
    #transcript-panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .msg {
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      line-height: 1.5;
      border-left: 3px solid var(--border);
    }
    .msg.user    { border-left-color: var(--accent2); background: rgba(0, 100, 220, 0.1); }
    .msg.jarvis  { border-left-color: var(--accent);  background: rgba(0, 170, 255, 0.07); }
    .msg .role   { font-size: 0.6rem; color: var(--text-dim); letter-spacing: 2px; margin-bottom: 3px; }

    /* ── TEXT INPUT ── */
    #input-row {
      width: 100%;
      display: flex;
      gap: 8px;
      padding-bottom: 20px;
    }
    #text-input {
      flex: 1;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 14px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.85rem;
      outline: none;
      transition: border-color .2s;
    }
    #text-input:focus { border-color: var(--accent); }
    #text-input::placeholder { color: var(--text-dim); }

    button {
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
      border-radius: 6px;
      padding: 10px 18px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.8rem;
      cursor: pointer;
      letter-spacing: 1px;
      transition: background .2s, box-shadow .2s;
    }
    button:hover { background: rgba(0, 170, 255, 0.12); box-shadow: 0 0 10px var(--glow); }
    button:disabled { opacity: 0.35; cursor: default; box-shadow: none; }

    /* ── LOGIN OVERLAY ── */
    #login-overlay {
      position: fixed; inset: 0;
      background: rgba(3, 8, 16, 0.96);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      z-index: 100;
    }
    #login-overlay.hidden { display: none; }
    #login-overlay h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 2rem;
      letter-spacing: 10px;
      color: var(--accent);
      text-shadow: 0 0 20px var(--glow);
    }
    #login-overlay p { font-size: 0.75rem; color: var(--text-dim); }
    #token-input {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px 18px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.9rem;
      width: 300px;
      outline: none;
      text-align: center;
      letter-spacing: 2px;
    }
    #token-input:focus { border-color: var(--accent); }
    #login-err { color: var(--danger); font-size: 0.75rem; min-height: 1em; }

    /* ── HUD corner decorations ── */
    .hud-tl, .hud-br {
      position: fixed;
      width: 80px; height: 80px;
      pointer-events: none;
    }
    .hud-tl { top: 60px; left: 10px; border-top: 1px solid var(--border); border-left: 1px solid var(--border); }
    .hud-br { bottom: 10px; right: 10px; border-bottom: 1px solid var(--border); border-right: 1px solid var(--border); }
  </style>
</head>
<body>

<!-- Login Overlay -->
<div id="login-overlay" class="hidden">
  <h1>J.A.R.V.I.S</h1>
  <p>ZUGANGS-TOKEN ERFORDERLICH</p>
  <input id="token-input" type="password" placeholder="Token eingeben …" autocomplete="off" />
  <button id="login-btn">AUTHENTIFIZIEREN</button>
  <p id="login-err"></p>
</div>

<!-- HUD decorations -->
<div class="hud-tl"></div>
<div class="hud-br"></div>

<header>
  <div class="logo">J.A.R.V.I.S</div>
  <div class="status-bar">
    <span><div class="dot" id="dot-mic"></div> MIC</span>
    <span><div class="dot" id="dot-api"></div> API</span>
    <span><div class="dot" id="dot-voice"></div> VOICE</span>
  </div>
</header>

<main>
  <div id="orb-wrap">
    <canvas id="orb-canvas" width="180" height="180"></canvas>
    <div id="orb-hint">klick oder „Hey Jarvis"</div>
  </div>

  <canvas id="wave-canvas" width="400" height="40"></canvas>

  <div id="status">BEREIT</div>

  <div id="reply-panel">
    <div id="reply-label">LETZTE ANTWORT</div>
    <div id="reply-text">—</div>
  </div>

  <div id="transcript-panel"></div>

  <div id="input-row">
    <input id="text-input" type="text" placeholder="Nachricht eingeben …" />
    <button id="send-btn">SENDEN</button>
    <button id="clear-btn" title="Verlauf löschen">CLR</button>
  </div>
</main>

<script type="module" src="/orb.js"></script>
<script type="module" src="/app.js"></script>
</body>
</html>
